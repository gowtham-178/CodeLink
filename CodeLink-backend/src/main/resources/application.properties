spring.config.import=optional:file:.env[.properties]

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ── Datasource (PostgreSQL / Neon) ────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Redis (Upstash) ───────────────────────────────────────────────────────────
# Prevent Redis from scanning JPA repositories
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# ── CORS ──────────────────────────────────────────────────────────────────────
codelink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── JWT ───────────────────────────────────────────────────────────────────────
# Secret must be >= 256 bits (32 bytes) for HS256
codelink.jwt.secret=${JWT_SECRET}
# Token validity in milliseconds (default 7 days)
codelink.jwt.expiry-ms=${JWT_EXPIRY_MS:604800000}
