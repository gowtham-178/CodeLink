# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT}

# ── Redis (Upstash) ───────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins
codelink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Room lifecycle ────────────────────────────────────────────────────────────
# How many hours until a room expires (Redis TTL, reset on each edit)
codelink.room.expiry-hours=${ROOM_EXPIRY_HOURS:24}

